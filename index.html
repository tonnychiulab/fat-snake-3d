<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🐍 3D 胖胖蛇 — Fat Snake 3D</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div id="gameWrapper">
  <!-- ===== HUD 頂部資訊欄 ===== -->
  <div id="hud">
    <div class="hud-item">
      <span class="icon">🍎</span>
      <span>分數</span>
      <span class="value" id="scoreVal">0</span>
    </div>
    <div class="hud-item">
      <span class="icon">🏆</span>
      <span>最高</span>
      <span class="value" id="highVal">0</span>
    </div>
    <div class="hud-item">
      <span class="icon">🐍</span>
      <span>長度</span>
      <span class="value" id="lenVal">3</span>
    </div>
    <div class="hud-item">
      <span class="icon">⚡</span>
      <span>等級</span>
      <span class="value" id="levelVal">1</span>
    </div>
  </div>

  <!-- ===== 遊戲畫布 ===== -->
  <div id="canvasContainer">
    <canvas id="gameCanvas" width="640" height="640"></canvas>
    <div id="effectBadge"></div>

    <!-- 開始 / 結束 疊加層 -->
    <div id="overlay">
      <h1><span class="snake-emoji">🐍</span> 3D 胖胖蛇</h1>
      <p class="subtitle">
        用方向鍵或 WASD 控制蛇蛇吃水果！<br>
        🍎 常見 → 🍒 稀有 → 💎 傳說 → ✨ 神話
      </p>
      <button class="start-btn" id="startBtn">🎮 開始遊戲</button>
    </div>
  </div>

  <!-- ===== 鍵盤提示 ===== -->
  <div class="controls-hint">
    方向鍵 / WASD 控制方向 ｜ 空白鍵 暫停
  </div>

  <!-- ===== 手機虛擬搖桿 ===== -->
  <div id="mobileControls">
    <div class="dpad">
      <div class="empty"></div>
      <button id="btnUp">⬆️</button>
      <div class="empty"></div>
      <button id="btnLeft">⬅️</button>
      <div class="empty"></div>
      <button id="btnRight">➡️</button>
      <div class="empty"></div>
      <button id="btnDown">⬇️</button>
      <div class="empty"></div>
    </div>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
